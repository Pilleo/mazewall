import org.gradle.api.credentials.PasswordCredentials
import org.gradle.process.CommandLineArgumentProvider

plugins { id 'java'; id 'org.springframework.boot' version '4.1.1' }
java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
def candidate = providers.gradleProperty('consumerVersion').get()
if (!(candidate ==~ /[0-9]+\.[0-9]+\.[0-9]+[-.A-Za-z0-9]*/)) throw new GradleException('Pinned safe consumerVersion required')
repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'mazewall'
                url = uri(providers.gradleProperty('consumerRepository').get())
                if (url.scheme == 'https' && url.host == 'maven.pkg.github.com') credentials(PasswordCredentials)
            }
        }
        filter { includeGroup 'io.mazewall' }
    }
    mavenCentral()
}
dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.1.1')
    implementation "io.mazewall:mazewall-spring-boot-starter:$candidate"
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'com.h2database:h2'
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
dependencyLocking { lockAllConfigurations(); lockMode = LockMode.STRICT; lockFile = file("locks/$candidate/gradle.lockfile") }
springBoot { mainClass = 'demo.report.ReportApplication' }
tasks.named('bootJar') { archiveFileName = 'application.jar' }
tasks.named('jar') { enabled = false }
abstract class BootJarArguments implements CommandLineArgumentProvider {
    @InputFile @PathSensitive(PathSensitivity.NONE) abstract RegularFileProperty getApplicationJar()
    List<String> asArguments() { ["-Dexample.bootJar=${applicationJar.get().asFile.absolutePath}".toString()] }
}
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    maxParallelForks = 1
    jvmArgumentProviders.add(objects.newInstance(BootJarArguments).tap { applicationJar.set(tasks.bootJar.archiveFile) })
    testLogging { events 'passed', 'failed', 'standardOut', 'standardError'; showStandardStreams = true }
}
tasks.test { useJUnitPlatform { excludeTags 'native' } }
tasks.register('nativeTest', Test) {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'native' }
    outputs.upToDateWhen { false }; outputs.cacheIf { false }
}
