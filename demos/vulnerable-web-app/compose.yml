services:
    unprotected:
        image: vulnerable-web-app-unprotected:latest
        build:
            context: .
            dockerfile: Containerfile
            cache_from:
                - vulnerable-web-app-unprotected:latest
        ports:
            - "127.0.0.1:8082:8080"
        environment:
            - MAZEWALL_ENABLED=false
            - SERVER_ADDRESS=0.0.0.0
        healthcheck:
            test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/admin/log"]
            interval: 10s
            timeout: 3s
            retries: 5
        annotations:
            io.podman.annotations.seccomp: ${PWD}/../../infra/dev/podman-seccomp.json

    protected:
        image: vulnerable-web-app-protected:latest
        build:
            context: .
            dockerfile: Containerfile
            cache_from:
                - vulnerable-web-app-protected:latest
        ports:
            - "127.0.0.1:8081:8081"
        environment:
            - MAZEWALL_ENABLED=true
            - SERVER_ADDRESS=0.0.0.0
            - SERVER_PORT=8081
        healthcheck:
            test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8081/admin/log"]
            interval: 10s
            timeout: 3s
            retries: 5
        annotations:
            io.podman.annotations.seccomp: ${PWD}/../../infra/dev/podman-seccomp.json

    profile:
        image: vulnerable-web-app-profile:latest
        build:
            context: .
            dockerfile: Containerfile
            cache_from:
                - vulnerable-web-app-profile:latest
        ports:
            - "127.0.0.1:8083:8083"
        environment:
            - MAZEWALL_ENABLED=false
            - MAZEWALL_PROFILE=true
            - SERVER_ADDRESS=0.0.0.0
            - SERVER_PORT=8083
            - JAVA_TOOL_OPTIONS=-Dmazewall.sbob.path=/app/output/sbob.json
        healthcheck:
            test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8083/admin/log"]
            interval: 10s
            timeout: 3s
            retries: 5
        volumes:
            - ../output:/app/output:rw
        annotations:
            io.podman.annotations.seccomp: ${PWD}/../../infra/dev/podman-seccomp.json
