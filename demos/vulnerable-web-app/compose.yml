services:
    unprotected:
        image: vulnerable-web-app-unprotected:latest
        build:
            context: .
            dockerfile: Containerfile
            cache_from:
                - vulnerable-web-app-unprotected:latest
        ports:
            - "127.0.0.1:8082:8080"
        environment:
            - MAZEWALL_ENABLED=false
        annotations:
            io.podman.annotations.seccomp: ${PWD}/../../infra/dev/podman-seccomp.json

    protected:
        image: vulnerable-web-app-protected:latest
        build:
            context: .
            dockerfile: Containerfile
            cache_from:
                - vulnerable-web-app-protected:latest
        ports:
            - "127.0.0.1:8081:8081"
        environment:
            - MAZEWALL_ENABLED=true
            - SERVER_PORT=8081
        annotations:
            io.podman.annotations.seccomp: ${PWD}/../../infra/dev/podman-seccomp.json

    profile:
        image: vulnerable-web-app-profile:latest
        build:
            context: .
            dockerfile: Containerfile
            cache_from:
                - vulnerable-web-app-profile:latest
        ports:
            - "127.0.0.1:8083:8083"
        environment:
            - MAZEWALL_ENABLED=false
            - MAZEWALL_PROFILE=true
            - SERVER_PORT=8083
            - JAVA_TOOL_OPTIONS=-Dmazewall.sbob.path=/app/output/sbob.json
        volumes:
            - ../output:/app/output:rw
        annotations:
            io.podman.annotations.seccomp: ${PWD}/../../infra/dev/podman-seccomp.json
