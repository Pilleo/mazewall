# Enable the build cache to save time by reusing outputs produced by other successful builds.
# https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching=true
# Enable the configuration cache to reuse the build configuration and enable parallel task execution.
# (Note that some plugins may not yet be compatible with the configuration cache.)
# https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.parallel.threads=2
org.gradle.workers.max=2

# Keep the daemon below the host's ample capacity while leaving enough metaspace for the
# Kotlin, Detekt, and PlantUML plugins used by the full verification build.
org.gradle.jvmargs=-Xms256m -Xmx1g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError

# Clean & Quiet Log Formatting: Summarize deprecation warnings
org.gradle.warning.mode=summary
org.gradle.console=auto
