name: kernel-drift-watch

# issue-20260823-172002: detect upstream uapi header drift against our committed snapshot.
on:
  schedule:
    - cron: "0 6 1 * *" # monthly, 06:00 UTC on the 1st
  workflow_dispatch:

jobs:
  uapi-diff:
    runs-on: ubuntu-26.04
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Test UAPI watcher
        run: python3 scripts/tests/test_kernel_uapi.py

      - name: Diff tracked headers against snapshot
        id: diff
        run: |
          OUTPUT="$RUNNER_TEMP/kernel-uapi-diffs"
          set +e
          bash scripts/check_kernel_uapi.sh --install \
            --snapshot-dir docs/internals/research/uapi-snapshot/linux \
            --headers-dir /usr/include/linux \
            --output-dir "$OUTPUT"
          STATUS=$?
          set -e
          KIND=$(sed -n 's/^kind=//p' "$OUTPUT/kind" 2>/dev/null || true)
          CHANGED=$(cat "$OUTPUT/changed" 2>/dev/null || true)
          VERSION=$(cat "$OUTPUT/package-version" 2>/dev/null || true)
          printf 'kind=%s\nchanged=%s\npackage-version=%s\n' "$KIND" "$CHANGED" "$VERSION" >> "$GITHUB_OUTPUT"
          cat "$OUTPUT/report.txt" >> "$GITHUB_STEP_SUMMARY" || true
          exit "$STATUS"

      - name: Upload UAPI comparison diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-uapi-diffs
          path: ${{ runner.temp }}/kernel-uapi-diffs
          if-no-files-found: error

      - name: File drift issue
        if: failure() && steps.diff.outputs.kind == 'drift'
        uses: actions/github-script@v7
        with:
          script: |
            const changed = "${{ steps.diff.outputs.changed }}" || "unknown";
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[kernel-drift] uapi headers changed:${changed}`,
              body: [
                "Upstream uapi headers drifted from `docs/internals/research/uapi-snapshot/`.",
                "",
                "Follow `docs/internals/research/kernel-drift-watch.md`: review the diff in the",
                "run summary, complete a decision-log row, refresh the snapshot, and file",
                "targeted backlog issues if policy/enforcer behavior must change.",
                "",
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join("\n"),
              labels: ["security", "drift-watch"],
            })
