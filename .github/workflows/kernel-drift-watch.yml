name: kernel-drift-watch

# issue-20260823-172002: detect upstream uapi header drift against our committed snapshot.
on:
  schedule:
    - cron: "0 6 1 * *" # monthly, 06:00 UTC on the 1st
  workflow_dispatch:

jobs:
  uapi-diff:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install current uapi headers
        run: sudo apt-get update && sudo apt-get install -y linux-libc-dev

      - name: Diff tracked headers against snapshot
        id: diff
        run: |
          SNAPSHOT="docs/internals/research/uapi-snapshot/linux"
          mkdir -p "$SNAPSHOT"
          STATUS=0
          CHANGED=""
          for h in seccomp.h landlock.h io_uring.h audit.h bpf_common.h; do
            SRC="/usr/include/linux/$h"
            if [ ! -f "$SRC" ]; then
              echo "header missing: $SRC"; continue
            fi
            if [ ! -f "$SNAPSHOT/$h" ]; then
              cp "$SRC" "$SNAPSHOT/$h"
              CHANGED="$CHANGED $h(new)"
              STATUS=1
              continue
            fi
            if ! diff -u "$SNAPSHOT/$h" "$SRC" > /tmp/diff_$h.txt; then
              echo "::warning::uapi drift detected in $h"
              cat /tmp/diff_$h.txt >> "$GITHUB_STEP_SUMMARY" || true
              CHANGED="$CHANGED $h"
              STATUS=1
            fi
          done
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          exit $STATUS

      - name: File drift issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const changed = "${{ steps.diff.outputs.changed }}" || "unknown";
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[kernel-drift] uapi headers changed:${changed}`,
              body: [
                "Upstream uapi headers drifted from `docs/internals/research/uapi-snapshot/`.",
                "",
                "Follow `docs/internals/research/kernel-drift-watch.md`: review the diff in the",
                "run summary, complete a decision-log row, refresh the snapshot, and file",
                "targeted backlog issues if policy/enforcer behavior must change.",
                "",
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join("\n"),
              labels: ["security", "drift-watch"],
            })
