name: Global Benchmarks

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    integration-boundaries:
        runs-on: ubuntu-26.04
        timeout-minutes: 30
        defaults:
            run:
                shell: bash -euo pipefail {0}
        steps:
            - name: Checkout Code
              uses: actions/checkout@v6
            - name: Set up JDK 25
              uses: actions/setup-java@v5
              with:
                  java-version: "25"
                  distribution: temurin
            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v6
              with:
                  cache-read-only: true
            - name: Prepare Benchmark Evidence
              run: |
                  evidence="$PWD/build/reports/benchmarks/run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
                  mkdir -p "$(dirname "$evidence")"
                  mkdir "$evidence"
                  revision=$(git rev-parse HEAD)
                  {
                      echo "BOUNDARY_EVIDENCE=$evidence"
                      echo "BOUNDARY_VERSION=0.1.0-benchmark.${revision:0:12}"
                      echo "BOUNDARY_REPOSITORY=$PWD/build/benchmark-repository"
                      echo "BOUNDARY_LIB=$PWD/benchmarks/integration-boundaries/build/install/integration-boundaries/lib"
                      echo "BOUNDARY_TMP=$(mktemp -d /tmp/mwb.XXXXXXXX)"
                  } >> "$GITHUB_ENV"
                  printf '%s\n' "$revision" > "$evidence/source-revision.txt"
                  git status --porcelain > "$evidence/source-status.txt"
                  {
                      uname -a
                      lscpu
                      java -version
                  } > "$evidence/environment.txt" 2>&1
            - name: Install Native Build Tools
              run: |
                  sudo apt-get update
                  sudo apt-get install -y build-essential cmake pkg-config clang llvm systemtap-sdt-dev
            - name: Build Existing Boundary Harness
              run: |
                  python3 scripts/ci_resource_probe.py --output "$BOUNDARY_EVIDENCE/build-resources.json" -- \
                      timeout --kill-after=30s 900s bash -euo pipefail -c '
                          modules=(platform enforcer profiler portals:runtime portals:worker portals:codegen integrations:koog demos:koog-contained-tool:service-api koog-denied-api demos:koog-contained-tool)
                          tasks=()
                          for module in "${modules[@]}"; do tasks+=(":$module:publishAllPublicationsToConsumerBaselineRepository"); done
                          bash scripts/koog-build.sh --console=plain --max-workers=1 --no-daemon \
                              -I tests/consumers/stage.init.gradle \
                              "-PconsumerVersion=$BOUNDARY_VERSION" "-PconsumerRepository=$BOUNDARY_REPOSITORY" \
                              -- -PkoogNativeFixtures=true "${tasks[@]}"
                          consumer=(./gradlew -p benchmarks/integration-boundaries --console=plain --max-workers=1 --no-daemon --no-configuration-cache "-PconsumerVersion=$BOUNDARY_VERSION" "-PconsumerRepository=$BOUNDARY_REPOSITORY")
                          "${consumer[@]}" dependencies --write-locks
                          "${consumer[@]}" check verifyPublishedClosure installDist
                      ' 2>&1 | (ulimit -f 16384; tee "$BOUNDARY_EVIDENCE/build.log")
            - name: Freeze Benchmark Inputs
              run: |
                  git ls-files -z | xargs -0 sha256sum > "$BOUNDARY_EVIDENCE/source.sha256"
                  find "$BOUNDARY_REPOSITORY" "$BOUNDARY_LIB" -type f -print0 | sort -z | xargs -0 sha256sum > "$BOUNDARY_EVIDENCE/artifacts.sha256"
                  lock="benchmarks/integration-boundaries/locks/$BOUNDARY_VERSION.lockfile"
                  sha256sum "$lock" >> "$BOUNDARY_EVIDENCE/artifacts.sha256"
                  cp "$lock" "$BOUNDARY_EVIDENCE/consumer.lockfile"
                  python3 - "$BOUNDARY_LIB/koog-contained-tool-$BOUNDARY_VERSION.jar" "$BOUNDARY_EVIDENCE/custody.json" <<'PY'
                  import hashlib, json, pathlib, sys, zipfile
                  with zipfile.ZipFile(sys.argv[1]) as jar:
                      metadata = dict(line.split("=", 1) for line in jar.read("META-INF/mazewall/portal/worker-artifacts/bounded-text-worker").decode("utf-8").splitlines() if line)
                      bundle = jar.read(metadata["resource"])
                      digest = hashlib.sha256(bundle).hexdigest()
                      if metadata["format"] != "2" or metadata["sha256"] != digest:
                          raise ValueError("Installed worker bundle does not match its metadata")
                  pathlib.Path(sys.argv[2]).write_text(json.dumps({"workerBundleSha256": digest}) + "\n", encoding="utf-8")
                  PY
            - name: Run Benchmark
              run: |
                  cd "$BOUNDARY_EVIDENCE"
                  python3 "$GITHUB_WORKSPACE/scripts/ci_resource_probe.py" --output native-resources.json -- \
                      timeout --kill-after=30s 240s java -Xmx256m --enable-native-access=ALL-UNNAMED \
                      "-Djava.io.tmpdir=$BOUNDARY_TMP" "-Dbenchmark.cache=$BOUNDARY_EVIDENCE/worker-cache" \
                      -cp "$BOUNDARY_LIB/*" io.mazewall.benchmark.BoundariesKt \
                      --samples 8 --size 1024 --pressure 4 --seconds 60 --concurrency 1 \
                      2>&1 | (ulimit -f 8192; tee raw.log)
            - name: Verify Frozen Benchmark Inputs
              run: |
                  sha256sum --check "$BOUNDARY_EVIDENCE/source.sha256"
                  sha256sum --check "$BOUNDARY_EVIDENCE/artifacts.sha256"
            - name: Validate Raw Observations
              run: |
                  ./gradlew verifyIntegrationBoundaryEvidence --console=plain --no-daemon --max-workers=1 \
                      "-PboundaryRaw=$BOUNDARY_EVIDENCE/raw.log" "-PboundaryCustody=$BOUNDARY_EVIDENCE/custody.json" \
                      2>&1 | (ulimit -f 8192; tee "$BOUNDARY_EVIDENCE/validation.log")
            - name: Upload Benchmark Evidence
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: global-benchmarks-${{ github.run_id }}-${{ github.run_attempt }}
                  path: |
                      build/reports/benchmarks/run-*/*.log
                      build/reports/benchmarks/run-*/*.json
                      build/reports/benchmarks/run-*/*.txt
                      build/reports/benchmarks/run-*/*.sha256
                      build/reports/benchmarks/run-*/*.lockfile
                  if-no-files-found: error
                  retention-days: 14
