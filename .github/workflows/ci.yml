name: CI

on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]

# Replace obsolete PR work, without grouping/cancelling separate default-branch pushes.
concurrency:
    group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    optional-integrations:
        name: Koog and Spring Integration Acceptance
        runs-on: ubuntu-26.04
        timeout-minutes: 90
        permissions:
            contents: read
        steps:
            - name: Checkout Code
              uses: actions/checkout@v6
            - name: Compute Container Gradle Cache Key
              id: container_cache_key
              run: |
                  hash=$(./scripts/ci_cache_key.sh)
                  echo "hash=$hash" >> "$GITHUB_OUTPUT"
            - name: Set up JDK 25
              uses: actions/setup-java@v5
              with:
                  java-version: "25"
                  distribution: "temurin"
            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v6
              with:
                  cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
                  cache-read-only: false
            - name: Build Optional Adapters With Strict Dependency and Configuration Cache Checks
              run: >-
                  ./gradlew -PincludeKoogIntegration=true -PkoogBootstrap=true -PincludeSpringIntegration=true
                  :integrations:koog:build :integrations:spring:mazewall-spring-boot:build
                  :integrations:spring:mazewall-spring-boot-starter:build
                  --configuration-cache-problems=fail --no-daemon --max-workers=1
            - name: Prime Optional Adapter Post-Build Configuration Cache
              run: |
                  mkdir -p build/reports/ci-resources
                  : > build/reports/ci-resources/optional-adapters-cache.log
                  ./gradlew -PincludeKoogIntegration=true -PkoogBootstrap=true -PincludeSpringIntegration=true \
                      :integrations:koog:build :integrations:spring:mazewall-spring-boot:build \
                      :integrations:spring:mazewall-spring-boot-starter:build \
                      --configuration-cache-problems=fail --no-daemon --max-workers=1 --dry-run
            - name: Prove Optional Adapter Configuration Cache Reuse
              run: |
                  set -o pipefail
                  ./gradlew -PincludeKoogIntegration=true -PkoogBootstrap=true -PincludeSpringIntegration=true \
                      :integrations:koog:build :integrations:spring:mazewall-spring-boot:build \
                      :integrations:spring:mazewall-spring-boot-starter:build \
                      --configuration-cache-problems=fail --no-daemon --max-workers=1 --dry-run \
                      2>&1 | tee build/reports/ci-resources/optional-adapters-cache.log
                  grep -Fq 'Configuration cache entry reused' build/reports/ci-resources/optional-adapters-cache.log
            - name: Setup Podman Socket
              run: |
                  mkdir -p ~/.config/containers
                  echo -e '[engine]\nruntime = "runc"' > ~/.config/containers/containers.conf
                  systemctl --user enable --now podman.socket
                  echo "DOCKER_HOST=unix://$XDG_RUNTIME_DIR/podman/podman.sock" >> $GITHUB_ENV
                  echo "MAZEWALL_CONTAINER_ENGINE=podman" >> $GITHUB_ENV
            - name: Restore Optional Container Gradle Cache
              uses: actions/cache/restore@v4
              with:
                  path: ~/.cache/mazewall/container-gradle
                  key: optional-container-gradle-${{ runner.os }}-${{ steps.container_cache_key.outputs.hash }}-${{ github.sha }}
                  restore-keys: |
                      optional-container-gradle-${{ runner.os }}-${{ steps.container_cache_key.outputs.hash }}-
                      optional-container-gradle-${{ runner.os }}-
                      container-gradle-${{ runner.os }}-
            - name: Restore Existing Test Runner Image
              id: runner_image_restore
              uses: actions/cache/restore@v4
              with:
                  path: ${{ github.workspace }}/.cache/podman-image
                  key: podman-runner-v2-${{ hashFiles('infra/dev/Containerfile') }}
            - name: Load Existing Test Runner Image
              if: steps.runner_image_restore.outputs.cache-hit == 'true'
              run: |
                  test -s .cache/podman-image/mazewall-test-runner.tar
                  podman load -i .cache/podman-image/mazewall-test-runner.tar
            - name: Verify Real Optional Publications and Native Showcases
              run: ./scripts/run_containerized_tests.sh :optionalIntegrationCheck --no-configuration-cache --max-workers=1
            - name: Verify Optional Workspace and Cache Ownership
              id: optional_ownership
              if: always()
              run: |
                  for path in "$GITHUB_WORKSPACE" "$HOME/.gradle" "$HOME/.cache/mazewall"; do
                      if [ -d "$path" ]; then
                          foreign=$(find "$path" -xdev ! -user "$(id -u)" -print -quit)
                          if [ -n "$foreign" ]; then
                              echo "Unexpected non-caller-owned integration output: $foreign" >&2
                              exit 1
                          fi
                      fi
                  done
            - name: Save Optional Container Gradle Cache
              if: always() && steps.optional_ownership.outcome == 'success' && steps.container_cache_key.outcome == 'success'
              uses: actions/cache/save@v4
              with:
                  path: ~/.cache/mazewall/container-gradle
                  key: optional-container-gradle-${{ runner.os }}-${{ steps.container_cache_key.outputs.hash }}-${{ github.sha }}
            - name: Upload Optional JUnit Diagnostics
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: optional-integration-junit
                  path: |
                      integrations/**/build/test-results/**/*.xml
                      build/reports/ci-resources/optional-adapters-cache.log
                      build/test-results/optionalIntegrationCheck/*.xml
                      build/reports/optional-integrations/run-*/*.log
                      build/reports/optional-integrations/run-*/*.command.json
                      build/reports/optional-integrations/run-*/*-reports/**
                  if-no-files-found: ignore
    core-quality:
        name: Core Quality and Kernel Validation
        # Dedicated-process worker correctness requires Landlock TSYNC (ABI 8+).
        runs-on: ubuntu-26.04
        timeout-minutes: 90
        permissions:
            contents: read
            pull-requests: write
        outputs:
            container_cache_hash: ${{ steps.container_cache_key.outputs.hash }}
        steps:
            - name: Checkout Code
              uses: actions/checkout@v6
            - name: Compute Container Gradle Cache Key
              id: container_cache_key
              run: |
                  hash=$(./scripts/ci_cache_key.sh)
                  echo "hash=$hash" >> "$GITHUB_OUTPUT"
            - name: Set up JDK 25
              uses: actions/setup-java@v5
              with:
                  java-version: "25"
                  distribution: "temurin"
            - name: Check file changes
              id: filter
              uses: dorny/paths-filter@v3
              with:
                  filters: |
                      code:
                          - '**/*.kt'
                          - '**/*.java'
                          - '**/*.kts'
                          - '**/*.gradle'
                          - 'gradle/libs.versions.toml'
                          - '**/gradle.lockfile'
                          - 'gradle/verification-metadata.xml'
                          - 'config/spotbugs/**'
                          - '**/gradle.properties'
                          - '**/Containerfile'
                          - 'scripts/**'
                          - '.github/workflows/ci.yml'
                          - '.github/workflows/security-data.yml'

            - name: Restore Container Gradle Cache
              uses: actions/cache/restore@v4
              with:
                  path: |
                      ~/.cache/mazewall/container-gradle
                  key: container-gradle-${{ runner.os }}-${{ steps.container_cache_key.outputs.hash }}-${{ github.sha }}
                  restore-keys: |
                      container-gradle-${{ runner.os }}-${{ steps.container_cache_key.outputs.hash }}-
                      optional-container-gradle-${{ runner.os }}-${{ steps.container_cache_key.outputs.hash }}-
                      optional-container-gradle-${{ runner.os }}-
                      container-gradle-${{ runner.os }}-
            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v6
              with:
                  cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
                  # GitHub scopes PR caches to the PR merge ref. Allowing writes
                  # lets reruns restore the first attempt without exposing the
                  # entry to the default branch.
                  cache-read-only: false
                  gradle-home-cache-includes: |
                      caches
                      notifications
            - name: Grant Execute Permission for Gradlew
              run: chmod +x gradlew
            - name: Run Host-Safe Unit and Reproducibility Gates
              id: host_verification
              # This gate intentionally precedes Podman setup: ordinary CI
              # runners must be able to prove unit behavior and coverage.
              run: ./gradlew :unitCheck :verifyGradleReproducibility --no-daemon
            - name: Prove configuration-cache reuse
              run: |
                  set -o pipefail
                  mkdir -p build/reports/ci-resources
                  ./gradlew :unitCheck :verifyGradleReproducibility --dry-run --configuration-cache --configuration-cache-problems=fail --no-daemon 2>&1 | tee build/reports/ci-resources/core-configuration-cache-prime.log
                  ./gradlew :unitCheck :verifyGradleReproducibility --dry-run --configuration-cache --configuration-cache-problems=fail --no-daemon 2>&1 | tee build/reports/ci-resources/core-configuration-cache-replay.log
                  grep -Fq 'Configuration cache entry reused' build/reports/ci-resources/core-configuration-cache-replay.log
            - name: Triage failed host verification
              if: steps.host_verification.outcome == 'failure'
              run: ./gradlew runTriage -Ptriage.failedTask=:unitCheck-or-verifyGradleReproducibility --no-daemon
            - name: Setup Podman Socket
              run: |
                  mkdir -p ~/.config/containers
                  echo -e '[engine]\nruntime = "runc"' > ~/.config/containers/containers.conf
                  systemctl --user enable --now podman.socket
                  echo "DOCKER_HOST=unix://$XDG_RUNTIME_DIR/podman/podman.sock" >> $GITHUB_ENV
                  echo "MAZEWALL_CONTAINER_ENGINE=podman" >> $GITHUB_ENV
            - name: Resolve Core Integration Compilation Cache
              id: core_compile_cache
              run: |
                  cache_home=$(./scripts/run_containerized_tests.sh --print-cache-home)
                  test -n "$cache_home"
                  printf 'path=%s/caches/build-cache-1\n' "$cache_home" >> "$GITHUB_OUTPUT"
            - name: Restore Core Integration Compilation Cache
              if: github.event_name == 'pull_request' && steps.core_compile_cache.outcome == 'success' && steps.core_compile_cache.outputs.path != ''
              uses: actions/cache/restore@v4
              with:
                  path: ${{ steps.core_compile_cache.outputs.path }}
                  key: core-integration-compile-${{ runner.os }}-${{ steps.container_cache_key.outputs.hash }}-${{ github.sha }}
                  restore-keys: |
                      core-integration-compile-${{ runner.os }}-${{ steps.container_cache_key.outputs.hash }}-
            - name: Restore Podman Cache
              id: cache-podman
              uses: actions/cache/restore@v4
              with:
                  path: ${{ github.workspace }}/.cache/podman-image
                  key: podman-runner-v2-${{ hashFiles('infra/dev/Containerfile') }}
            - name: Load Cached Podman Images
              if: steps.cache-podman.outputs.cache-hit == 'true'
              run: |
                  test -s .cache/podman-image/mazewall-test-runner.tar
                  podman load -i .cache/podman-image/mazewall-test-runner.tar
            - name: Run Privileged Kernel Gate and Assemble
              run: |
                  set -o pipefail
                  # unitCheck already ran on the host for this exact checkout.
                  ./scripts/run_containerized_tests.sh :kernelCheck assemble -PmazewallKernelLane=BASELINE 2>&1 | tee build.log
                  python3 scripts/verify_confined_helper_results.py baseline --results enforcer/build/test-results/integrationTest
            - name: Run Vulnerability Exploitation Demo
              if: steps.filter.outputs.code == 'true'
              run: ./scripts/run_vulnerable_app_demo.sh
            - name: Save All Podman Images to Cache Folder
              id: runner_image_export
              if: always() && steps.cache-podman.outputs.cache-hit != 'true'
              run: |
                  podman image exists mazewall-test-runner
                  mkdir -p "$GITHUB_WORKSPACE/.cache/podman-image"
                  podman save -o "$GITHUB_WORKSPACE/.cache/podman-image/mazewall-test-runner.tar" mazewall-test-runner:latest
                  test -s "$GITHUB_WORKSPACE/.cache/podman-image/mazewall-test-runner.tar"
            - name: Upload Podman Image Cache
              uses: actions/cache/save@v4
              if: always() && steps.cache-podman.outputs.cache-hit != 'true' && steps.runner_image_export.outcome == 'success'
              with:
                  path: ${{ github.workspace }}/.cache/podman-image
                  key: podman-runner-v2-${{ hashFiles('infra/dev/Containerfile') }}
            - name: Verify Workspace and Cache Ownership
              id: core_ownership
              if: always()
              run: |
                  for path in "$GITHUB_WORKSPACE" "$HOME/.gradle" "$HOME/.cache/mazewall"; do
                      if [ -d "$path" ]; then
                          foreign=$(find "$path" -xdev ! -user "$(id -u)" -print -quit)
                          if [ -n "$foreign" ]; then
                              echo "Unexpected non-caller-owned build output: $foreign" >&2
                              exit 1
                          fi
                      fi
                  done
            - name: Save Core Integration Compilation Cache
              if: always() && github.event_name == 'pull_request' && steps.core_ownership.outcome == 'success' && steps.container_cache_key.outcome == 'success' && steps.core_compile_cache.outcome == 'success' && steps.core_compile_cache.outputs.path != ''
              uses: actions/cache/save@v4
              with:
                  path: ${{ steps.core_compile_cache.outputs.path }}
                  key: core-integration-compile-${{ runner.os }}-${{ steps.container_cache_key.outputs.hash }}-${{ github.sha }}
            - name: Upload Gradle diagnostics
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: gradle-diagnostics
                  path: |
                      build/reports/problems/
                      build/reports/triage/
                      build/reports/gradle-baseline/
                      build/reports/test-health/
                      build/reports/ci-resources/core-configuration-cache-prime.log
                      build/reports/ci-resources/core-configuration-cache-replay.log
                      **/build/test-results/**/*.xml
                      **/hs_err_pid*.log
                  if-no-files-found: ignore
            - name: Save Container Gradle Cache (Master Only)
              uses: actions/cache/save@v4
              if: always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && steps.container_cache_key.outcome == 'success'
              with:
                  path: |
                      ~/.cache/mazewall/container-gradle
                  key: container-gradle-${{ runner.os }}-${{ steps.container_cache_key.outputs.hash }}-${{ github.sha }}
    build-logic-validation:
        name: Build Logic Validation
        runs-on: ubuntu-26.04
        timeout-minutes: 90
        permissions:
            contents: read
        steps:
            - name: Checkout Code
              uses: actions/checkout@v6
            - name: Set up JDK 25
              uses: actions/setup-java@v5
              with:
                  java-version: "25"
                  distribution: "temurin"
            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v6
              with:
                  cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
                  cache-read-only: false
            - name: Run Build Logic Verification
              run: |
                  set -o pipefail
                  mkdir -p build/reports/ci-resources
                  python3 scripts/ci_resource_probe.py --output build/reports/ci-resources/build-logic.json -- ./gradlew :buildLogicCheck --configuration-cache --configuration-cache-problems=fail --no-daemon --max-workers=1 --no-parallel 2>&1 | tee build/reports/ci-resources/build-logic.log
            - name: Run Consumer Build Logic Regressions
              run: ./gradlew :consumerBuildLogicTest --configuration-cache --configuration-cache-problems=fail --no-daemon --max-workers=1 --no-parallel
            - name: Upload Build Logic Diagnostics
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: build-logic-diagnostics
                  path: |
                      build/reports/ci-resources/build-logic.json
                      build/reports/ci-resources/build-logic.log
                      build/reports/problems/
                      buildSrc/build/reports/
                      buildSrc/build/test-results/
                      buildSrc/build/verification/
                      build/test-results/consumerBuildLogicTest/
                      build/reports/tests/consumerBuildLogicTest/
                  if-no-files-found: ignore
    mutation-tests:
        name: Mutation Validation
        runs-on: ubuntu-26.04
        timeout-minutes: 90
        permissions:
            contents: read
            pull-requests: read
        steps:
            - name: Checkout Code
              uses: actions/checkout@v6
            - name: Set up JDK 25
              uses: actions/setup-java@v5
              with:
                  java-version: "25"
                  distribution: "temurin"
            - name: Check file changes
              id: filter
              uses: dorny/paths-filter@v3
              with:
                  filters: |
                      code:
                          - '**/*.kt'
                          - '**/*.java'
                          - '**/*.kts'
                          - '**/*.gradle'
                          - 'gradle/libs.versions.toml'
                          - '**/gradle.lockfile'
                          - 'gradle/verification-metadata.xml'
                          - 'config/spotbugs/**'
                          - '**/gradle.properties'
                          - '**/Containerfile'
                          - 'scripts/**'
                          - '.github/workflows/ci.yml'
                          - '.github/workflows/security-data.yml'
            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v6
              with:
                  cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
                  cache-read-only: false
            - name: Run PITest (Host Unit Tests Only)
              if: steps.filter.outputs.code == 'true'
              run: >-
                  python3 scripts/ci_resource_probe.py --output build/reports/ci-resources/mutation.json --
                  ./gradlew :enforcer:pitest :platform:pitest :profiler:pitest
                  --no-daemon --max-workers=1 --no-parallel
                  -Pmazewall.pitest.threads=2 -Pmazewall.test.maxParallelForks=1
            - name: Upload Mutation Diagnostics
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: mutation-diagnostics
                  path: |
                      build/reports/ci-resources/mutation.json
                      enforcer/build/reports/pitest/
                      platform/build/reports/pitest/
                      profiler/build/reports/pitest/
                  if-no-files-found: ignore
    security-check:
        name: Security Validation
        runs-on: ubuntu-26.04
        timeout-minutes: 180
        permissions:
            contents: read
            pull-requests: read
            actions: read
        steps:
            - name: Checkout Code
              uses: actions/checkout@v6
            - name: Set up JDK 25
              uses: actions/setup-java@v5
              with:
                  java-version: "25"
                  distribution: "temurin"
            - name: Check file changes
              id: filter
              uses: dorny/paths-filter@v3
              with:
                  filters: |
                      code:
                          - '**/*.kt'
                          - '**/*.java'
                          - '**/*.kts'
                          - '**/*.gradle'
                          - 'gradle/libs.versions.toml'
                          - '**/gradle.lockfile'
                          - 'gradle/verification-metadata.xml'
                          - 'config/spotbugs/**'
                          - '**/gradle.properties'
                          - '**/Containerfile'
                          - 'scripts/**'
                          - '.github/workflows/ci.yml'
                          - '.github/workflows/security-data.yml'
            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v6
              with:
                  cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
                  cache-read-only: false
                  gradle-home-cache-excludes: dependency-check-data
            - name: Compute Security Data Metadata
              id: security_metadata
              run: |
                  python3 - <<'PY'
                  import os
                  import re
                  import tomllib
                  from pathlib import Path

                  with open('gradle/libs.versions.toml', 'rb') as catalog:
                      version = tomllib.load(catalog)['versions']['dependencyCheck']
                  if not isinstance(version, str) or not re.fullmatch(r'[0-9]+(?:\.[0-9]+)+(?:-[A-Za-z0-9.]+)?', version):
                      raise SystemExit('Unsafe Dependency-Check version')
                  home = os.environ['GRADLE_USER_HOME']
                  if not Path(home).is_absolute() or any(char in home for char in '\r\n'):
                      raise SystemExit('Expected absolute GRADLE_USER_HOME')
                  prefix = f"dc-data-v1-{os.environ['RUNNER_OS']}-{os.environ['RUNNER_ARCH']}-dc{version}_"
                  key = f"{prefix}{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
                  with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                      print(f'data_dir={Path(home) / "dependency-check-data"}', file=output)
                      print(f'prefix={prefix}', file=output)
                      print(f'key={key}', file=output)
                  PY
            - name: Test Security Snapshot Controls
              if: steps.filter.outputs.code == 'true'
              run: python3 scripts/test_security_snapshot.py
            - name: Select Retained Security Snapshot
              id: security_artifact
              if: steps.filter.outputs.code == 'true'
              uses: actions/github-script@v8
              env:
                  SNAPSHOT_PREFIX: ${{ steps.security_metadata.outputs.prefix }}
              with:
                  script: |
                      const fs = require('node:fs');
                      const path = require('node:path');
                      const {owner, repo} = context.repo;
                      const legacy = (await github.rest.actions.getWorkflow({owner, repo, workflow_id: 'ci.yml'})).data.id;
                      let updater;
                      try {
                        updater = (await github.rest.actions.getWorkflow({owner, repo, workflow_id: 'security-data.yml'})).data.id;
                      } catch (error) {
                        if (error.status !== 404) throw error;
                        updater = null;
                      }
                      if (!Number.isSafeInteger(legacy) || legacy <= 0 || (updater !== null && (!Number.isSafeInteger(updater) || updater <= 0))) throw new Error('Invalid trusted workflow identity');
                      const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {owner, repo, per_page: 100});
                      const candidates = [];
                      const prefix = 'security-snapshot-' + process.env.SNAPSHOT_PREFIX;
                      for (const artifact of artifacts) {
                        if (!artifact.name.startsWith(prefix) || artifact.expired || !Number.isSafeInteger(artifact.workflow_run?.id)) continue;
                        const origin = artifact.workflow_run;
                        const runId = origin.id;
                        const repositoryId = context.payload.repository.id;
                        const defaultBranch = context.payload.repository.default_branch;
                        if (origin.repository_id !== repositoryId || origin.head_repository_id !== repositoryId || origin.head_branch !== defaultBranch) continue;
                        const suffix = artifact.name.slice(prefix.length);
                        const match = /^(\d+)-([1-9]\d*)$/.exec(suffix);
                        if (!match || Number(match[1]) !== runId || !Number.isSafeInteger(Number(match[2]))) continue;
                        const run = (await github.rest.actions.getWorkflowRun({owner, repo, run_id: runId})).data;
                        const trustedWorkflow = (run.workflow_id === legacy && run.event === 'push') ||
                          (updater !== null && run.workflow_id === updater && ['schedule', 'workflow_dispatch'].includes(run.event));
                        if (!trustedWorkflow || run.id !== runId || run.repository?.id !== repositoryId ||
                            run.head_repository?.id !== repositoryId || run.head_branch !== defaultBranch ||
                            run.head_sha !== origin.head_sha || !Number.isSafeInteger(run.run_attempt) ||
                            run.run_attempt < 1 || Number(match[2]) > run.run_attempt) continue;
                        const attempt = (await github.rest.actions.getWorkflowRunAttempt({owner, repo, run_id: runId, attempt_number: Number(match[2])})).data;
                        candidates.push({artifact, run, attempt});
                      }
                      const input = path.join(process.env.RUNNER_TEMP, 'security-snapshot-candidates.json');
                      fs.writeFileSync(input, JSON.stringify({repository_id: context.payload.repository.id,
                        default_branch: context.payload.repository.default_branch,
                        workflow_ids: {updater, legacy_ci: legacy}, candidates}));
                      await exec.exec('python3', ['scripts/security_snapshot.py', 'select', input]);
            - name: Download Retained Security Snapshot
              id: security_artifact_download
              if: steps.filter.outputs.code == 'true' && steps.security_artifact.outputs.artifact_id != ''
              uses: actions/github-script@v8
              env:
                  SNAPSHOT_ARTIFACT_ID: ${{ steps.security_artifact.outputs.artifact_id }}
                  SNAPSHOT_SIZE: ${{ steps.security_artifact.outputs.size }}
              with:
                  script: |
                      const fs = require('node:fs');
                      const path = require('node:path');
                      const {Transform} = require('node:stream');
                      const {pipeline} = require('node:stream/promises');
                      const artifactId = Number(process.env.SNAPSHOT_ARTIFACT_ID);
                      const archiveSize = Number(process.env.SNAPSHOT_SIZE);
                      if (!Number.isSafeInteger(artifactId) || artifactId <= 0) throw new Error('Invalid snapshot artifact ID');
                      if (!Number.isSafeInteger(archiveSize) || archiveSize <= 0 || archiveSize > 2147483648) throw new Error('Invalid snapshot archive size');
                      const response = await github.rest.actions.downloadArtifact({...context.repo,
                        artifact_id: artifactId, archive_format: 'zip', request: {parseSuccessResponseBody: false}});
                      let bytes = 0;
                      const limit = new Transform({transform(chunk, encoding, callback) {
                        bytes += chunk.length;
                        if (bytes > archiveSize) return callback(new Error('Snapshot archive exceeds its recorded size'));
                        callback(null, chunk);
                      }});
                      await pipeline(response.data, limit,
                        fs.createWriteStream(path.join(process.env.RUNNER_TEMP, 'security-snapshot.zip'), {flags: 'wx', mode: 0o600}));
                      if (bytes !== archiveSize) throw new Error('Snapshot archive is incomplete');
            - name: Restore Retained Security Snapshot
              if: steps.filter.outputs.code == 'true' && steps.security_artifact_download.outcome == 'success'
              env:
                  SNAPSHOT_KEY: ${{ steps.security_artifact.outputs.key }}
                  SNAPSHOT_DIGEST: ${{ steps.security_artifact.outputs.digest }}
              run: python3 scripts/security_snapshot.py restore "$RUNNER_TEMP/security-snapshot.zip" "$GRADLE_USER_HOME/dependency-check-data"
            - name: Verify Restored Security Ownership
              id: restored_ownership
              if: steps.filter.outputs.code == 'true'
              run: |
                  for path in "$GITHUB_WORKSPACE" "${GRADLE_USER_HOME:?}" "${GRADLE_USER_HOME:?}/dependency-check-data"; do
                      if [ -e "$path" ]; then
                          foreign=$(find "$path" -xdev ! -user "$(id -u)" -print -quit)
                          if [ -n "$foreign" ]; then
                              echo "Unexpected non-caller-owned security output: $foreign" >&2
                              exit 1
                          fi
                      fi
                  done
            - name: Run Security Check
              if: steps.filter.outputs.code == 'true'
              run: |
                  set -o pipefail
                  ./gradlew verifySecuritySnapshot dependencyCheckSdk -Pmazewall.securitySnapshotScan=true --info --no-configuration-cache --no-daemon --no-parallel --max-workers=1 2>&1 | tee security-analysis.log
            - name: Require SDK Security Reports
              if: steps.filter.outputs.code == 'true'
              run: |
                  set -e
                  for report in \
                      build/reports/dependency-check-report.json \
                      platform/build/reports/dependency-check-report.json \
                      enforcer/build/reports/dependency-check-report.json \
                      profiler/build/reports/dependency-check-report.json \
                      portals/runtime/build/reports/dependency-check-report.json \
                      portals/worker/build/reports/dependency-check-report.json \
                      portals/codegen/build/reports/dependency-check-report.json; do
                      test -s "$report"
                  done
            - name: Run Demo Host Quality Gate
              if: ${{ !cancelled() }}
              run: |
                  ./gradlew :demos:vulnerable-web-app:unitCheck --no-daemon
                  python3 -m unittest discover -s exploits -p test_web_demo.py -k test_shared_image_is_built_once_for_all_three_modes
            - name: Verify Final Security Ownership
              if: always()
              run: |
                  for path in "$GITHUB_WORKSPACE" "${GRADLE_USER_HOME:?}" "${GRADLE_USER_HOME:?}/dependency-check-data"; do
                      if [ -e "$path" ]; then
                          foreign=$(find "$path" -xdev ! -user "$(id -u)" -print -quit)
                          if [ -n "$foreign" ]; then
                              echo "Unexpected non-caller-owned security output: $foreign" >&2
                              exit 1
                          fi
                      fi
                  done
            - name: Upload Security Diagnostics
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: security-diagnostics
                  path: |
                      security-update.log
                      security-analysis.log
                      build/reports/dependency-verification/
                      **/build/reports/dependency-check*
                      demos/vulnerable-web-app/build/test-results/
                      demos/vulnerable-web-app/build/reports/tests/
                      build/reports/triage/
                  if-no-files-found: ignore
    go-validation:
        name: Agentless Go Validation
        runs-on: ubuntu-26.04
        timeout-minutes: 45
        permissions:
            contents: read
            pull-requests: read
        env:
            GOWORK: "off"
            GOTOOLCHAIN: local
            GOMAXPROCS: "2"
            GOMEMLIMIT: 4GiB
            DOCKER_HOST: unix:///var/run/docker.sock
        steps:
            - name: Checkout Code
              uses: actions/checkout@v6
            - name: Check Go Changes
              id: go_changes
              uses: dorny/paths-filter@v3
              with:
                  filters: |
                      go:
                          - 'profiler/hotspot-agentless/**'
                          - 'experiments/hotspot-agentless/**'
                          - '.github/workflows/ci.yml'
                          - 'scripts/ci_resource_probe.py'
            - name: Set up Go
              if: steps.go_changes.outputs.go == 'true'
              uses: actions/setup-go@v6
              with:
                  go-version-file: profiler/hotspot-agentless/go.mod
                  cache-dependency-path: |
                      profiler/hotspot-agentless/go.sum
                      experiments/hotspot-agentless/go.sum
            - name: Install Pinned Vulnerability Scanner
              if: steps.go_changes.outputs.go == 'true'
              run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
            - name: Run Go Checks
              if: steps.go_changes.outputs.go == 'true'
              run: |
                  set -o pipefail
                  mkdir -p build/reports/ci-resources
                  python3 scripts/ci_resource_probe.py --output build/reports/ci-resources/go.json -- bash -euo pipefail -c '
                      result=0
                      for module in profiler/hotspot-agentless experiments/hotspot-agentless; do
                          if ! make -C "$module" unit; then result=1; fi
                          if ! make -C "$module" vuln; then result=1; fi
                      done
                      exit "$result"
                  ' 2>&1 | tee build/reports/ci-resources/go.log
            - name: Upload Go Diagnostics
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: go-diagnostics
                  path: |
                      build/reports/ci-resources/go.json
                      build/reports/ci-resources/go.log
                  if-no-files-found: ignore
    confined-helper-kernel:
        name: Confined Helper Kernel
        runs-on: ubuntu-26.04
        timeout-minutes: 90
        permissions:
            contents: read
        steps:
            - name: Checkout Code
              uses: actions/checkout@v6
            - name: Build and Run Confined Helper Kernel
              run: |
                  set -euo pipefail
                  python3 scripts/test_confined_helper_ci.py
                  docker --host unix:///var/run/docker.sock build -t mazewall-confined-ci -f infra/dev/Containerfile .
                  image=$(docker --host unix:///var/run/docker.sock image inspect --format '{{.Id}}' mazewall-confined-ci)
                  mkdir -p "$RUNNER_TEMP/mazewall-confined-gradle"
                  ./scripts/run_confined_helper_tests.sh --image "$image" --gradle-home "$RUNNER_TEMP/mazewall-confined-gradle"
            - name: Upload Confined Helper Evidence
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: confined-helper-kernel-evidence
                  path: build/reports/confined-helper-*
                  if-no-files-found: warn
    build-test-publish:
        # Keep the required check stable and fail closed for every skipped/failed lane.
        name: Build, Test, Security Scan & Publish
        needs: [core-quality, mutation-tests, security-check, build-logic-validation, go-validation, optional-integrations, confined-helper-kernel]
        if: always()
        runs-on: ubuntu-26.04
        permissions:
            contents: read
        outputs:
            container_cache_hash: ${{ needs.core-quality.outputs.container_cache_hash }}
        steps:
            - name: Require Core and Mutation Success
              run: test "${{ needs.core-quality.result }}" = success && test "${{ needs.mutation-tests.result }}" = success && test "${{ needs.security-check.result }}" = success && test "${{ needs.build-logic-validation.result }}" = success && test "${{ needs.go-validation.result }}" = success && test "${{ needs.optional-integrations.result }}" = success && test "${{ needs.confined-helper-kernel.result }}" = success
    publish:
        name: Publish Verified Packages
        needs: [optional-integrations, build-test-publish]
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        runs-on: ubuntu-26.04
        timeout-minutes: 30
        permissions:
            contents: read
            packages: write
        steps:
            - name: Checkout Code
              uses: actions/checkout@v6
            - name: Restore Container Gradle Cache
              uses: actions/cache/restore@v4
              with:
                  path: ~/.cache/mazewall/container-gradle
                  key: container-gradle-${{ runner.os }}-${{ needs.build-test-publish.outputs.container_cache_hash }}-${{ github.sha }}
                  restore-keys: |
                      container-gradle-${{ runner.os }}-${{ needs.build-test-publish.outputs.container_cache_hash }}-
                      container-gradle-${{ runner.os }}-
            - name: Setup Podman Socket
              run: |
                  mkdir -p ~/.config/containers
                  echo -e '[engine]\nruntime = "runc"' > ~/.config/containers/containers.conf
                  systemctl --user enable --now podman.socket
                  echo "DOCKER_HOST=unix://$XDG_RUNTIME_DIR/podman/podman.sock" >> $GITHUB_ENV
                  echo "MAZEWALL_CONTAINER_ENGINE=podman" >> $GITHUB_ENV
            - name: Restore Existing Test Runner Image
              id: runner_image_restore
              uses: actions/cache/restore@v4
              with:
                  path: ${{ github.workspace }}/.cache/podman-image
                  key: podman-runner-v2-${{ hashFiles('infra/dev/Containerfile') }}
            - name: Load Existing Test Runner Image
              if: steps.runner_image_restore.outputs.cache-hit == 'true'
              run: |
                  test -s .cache/podman-image/mazewall-test-runner.tar
                  podman load -i .cache/podman-image/mazewall-test-runner.tar
            - name: Publish to GitHub Packages
              run: >-
                  ./scripts/run_containerized_tests.sh -PincludeSpringIntegration=true
                  -PincludeKoogIntegration=true -PkoogBootstrap=true publishAllPublicationsToGitHubPackagesRepository
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GITHUB_ACTOR: ${{ github.actor }}
            - name: Verify Workspace and Cache Ownership
              if: always()
              run: |
                  for path in "$GITHUB_WORKSPACE" "$HOME/.cache/mazewall"; do
                      if [ -d "$path" ]; then
                          foreign=$(find "$path" -xdev ! -user "$(id -u)" -print -quit)
                          if [ -n "$foreign" ]; then
                              echo "Unexpected non-caller-owned publication output: $foreign" >&2
                              exit 1
                          fi
                      fi
                  done
