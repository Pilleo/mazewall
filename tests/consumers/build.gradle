plugins { id 'java-base' }

allprojects {
    dependencyLocking {
        lockAllConfigurations()
        lockMode = LockMode.STRICT
        if (providers.gradleProperty('consumerVersion').get() != '0.1.0-baseline.ea0a8276') {
            def compiler = providers.gradleProperty('consumerKotlinVersion').getOrElse('2.4.20')
            lockFile = rootProject.file("locks/${providers.gradleProperty('consumerVersion').get()}/kotlin-${compiler}/${project.name}.lockfile")
        }
    }
    repositories {
        maven {
            url = uri(providers.gradleProperty('consumerRepository').get())
            content { includeGroup 'io.mazewall' }
        }
        mavenCentral {
            content { excludeGroup 'io.mazewall' }
        }
    }
}

configurations {
    koogBaseline {
        attributes.attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
    }
    springBaseline {
        attributes.attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
    }
    koogCandidate {
        attributes.attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
    }
    springCandidate {
        attributes.attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
    }
}

dependencies {
    koogBaseline 'ai.koog:agents-tools:1.3.0'
    springBaseline platform('org.springframework.boot:spring-boot-dependencies:4.1.1')
    springBaseline 'org.springframework:spring-aop'
    springBaseline 'org.springframework:spring-jdbc'
    koogCandidate 'ai.koog:agents-tools:1.3.0'
    koogCandidate "io.mazewall:enforcer:${providers.gradleProperty('consumerVersion').get()}"
    springCandidate platform('org.springframework.boot:spring-boot-dependencies:4.1.1')
    springCandidate 'org.springframework:spring-aop'
    springCandidate 'org.springframework:spring-jdbc'
    springCandidate "io.mazewall:enforcer:${providers.gradleProperty('consumerVersion').get()}"
}

tasks.register('resolveIntegrationBaselines') {
    doLast {
        [configurations.koogBaseline, configurations.springBaseline, configurations.koogCandidate, configurations.springCandidate].each { configuration ->
            configuration.resolvedConfiguration.resolvedArtifacts.sort { it.moduleVersion.id.toString() }.each {
                logger.lifecycle("${configuration.name}: ${it.moduleVersion.id}")
            }
            if (configuration.name.endsWith('Candidate')) {
                verifyPackagedArtifacts(configuration)
            }
        }
    }
}

ext.verifyPackagedArtifacts = { configuration, expectedModules = ['enforcer', 'platform'] ->
    def dependencies = configuration.incoming.resolutionResult.allDependencies
    if (dependencies.any { it instanceof org.gradle.api.artifacts.result.ResolvedDependencyResult &&
        it.selected.id instanceof org.gradle.api.artifacts.component.ProjectComponentIdentifier }) {
        throw new GradleException("${configuration.name}: project/source substitution is forbidden")
    }
    def mazeArtifacts = configuration.resolvedConfiguration.resolvedArtifacts.findAll { it.moduleVersion.id.group == 'io.mazewall' }
    if (mazeArtifacts.collect { it.moduleVersion.id.name }.toSet() != expectedModules.toSet()) {
        throw new GradleException("${configuration.name}: expected packaged ${expectedModules}")
    }
    mazeArtifacts.each { artifact ->
        def id = artifact.moduleVersion.id
        def version = providers.gradleProperty('consumerVersion').get()
        def expected = new File(providers.gradleProperty('consumerRepository').get(), "io/mazewall/${id.name}/${version}/${id.name}-${version}.jar")
        if (id.version != version || artifact.file.canonicalFile != expected.canonicalFile) {
            throw new GradleException("${configuration.name}: unexpected MazeWall publication ${id} at ${artifact.file}")
        }
    }
}

subprojects {
    tasks.register('consumerEnvironment') {
        doLast {
            def launcher = javaToolchains.launcherFor {
                languageVersion = JavaLanguageVersion.of(providers.gradleProperty('consumerJdk').getOrElse('25').toInteger())
            }.get()
            logger.lifecycle("Consumer ${project.name}: JDK ${launcher.metadata.languageVersion}, ${launcher.metadata.vendor}, ${launcher.metadata.installationPath}")
            logger.lifecycle("Consumer Kotlin plugin: ${providers.gradleProperty('consumerKotlinVersion').getOrElse('2.4.20')}")
            ['compileClasspath', 'runtimeClasspath'].each { name ->
                configurations.getByName(name).resolvedConfiguration.resolvedArtifacts.sort { it.moduleVersion.id.toString() }.each {
                    logger.lifecycle("${project.name} ${name}: ${it.moduleVersion.id} -> ${it.file}")
                }
                def owners = project.name == 'doc-snippets' ? ['enforcer', 'platform', 'profiler'] : ['enforcer', 'platform']
                rootProject.verifyPackagedArtifacts(configurations.getByName(name), owners)
            }
            def compilerClasspath = configurations.findByName('kotlinBuildToolsApiClasspath')
            if (compilerClasspath != null) {
                compilerClasspath.resolvedConfiguration.resolvedArtifacts.sort { it.moduleVersion.id.toString() }.each {
                    logger.lifecycle("${project.name} compiler: ${it.moduleVersion.id} -> ${it.file}")
                }
            }
        }
    }
}
