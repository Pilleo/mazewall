// Temporary root wiring fixture. Coordinator owns the production root include patch.
abstract class Task7CodegenClasspath extends DefaultTask {
    @Classpath abstract ConfigurableFileCollection getPluginClasspath()
    @OutputFile abstract org.gradle.api.file.RegularFileProperty getTarget()
    @TaskAction void exportClasspath() {
        target.get().asFile.parentFile.mkdirs()
        target.get().asFile.text = pluginClasspath.files.join(File.pathSeparator)
    }
}
settingsEvaluated { settings ->
    if (!new File(settings.settingsDir, 'portals/runtime').isDirectory()) return
    settings.include ':integrations:koog'
    if (!settings.startParameter.projectProperties.containsKey('koogBootstrap')) {
        settings.include ':demos:koog-contained-tool', ':demos:koog-contained-tool:service-api'
        if (settings.startParameter.projectProperties['koogNativeFixtures'] == 'true') {
            settings.include ':koog-denied-api'
            settings.project(':koog-denied-api').projectDir = new File(settings.settingsDir, 'tests/consumers/koog-portal/denied-api')
        }
    }
}
projectsEvaluated {
    def generator = gradle.rootProject.findProject(':portals:codegen')
    if (generator == null) return
    if (gradle.rootProject.providers.gradleProperty('koogPublicationFixture').orNull == 'true') {
        def runtime = gradle.rootProject.project(':portals:runtime')
        runtime.publishing.publications.create('task7Fixture', MavenPublication) {
            from runtime.components.java
            artifactId = 'runtime'
        }
    }
    generator.tasks.register('task7CodegenClasspath', Task7CodegenClasspath) {
        dependsOn generator.tasks.named('jar'), gradle.rootProject.project(':portals:worker').tasks.named('jar')
        pluginClasspath.from(generator.tasks.named('jar').flatMap { it.archiveFile }, generator.configurations.runtimeClasspath)
        target.set(gradle.rootProject.layout.buildDirectory.file('task7-codegen-classpath.txt'))
    }
}
