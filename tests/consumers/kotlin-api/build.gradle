plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'application'
}

kotlin { jvmToolchain(providers.gradleProperty('consumerJdk').getOrElse('25').toInteger()) }

dependencies {
    implementation "io.mazewall:enforcer:${providers.gradleProperty('consumerVersion').get()}"
}

application { mainClass = 'consumer.KotlinApiConsumerKt' }
