plugins { id 'application' }

java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }

dependencies {
    implementation "io.mazewall:enforcer:${providers.gradleProperty('consumerVersion').get()}"
}

application { mainClass = 'consumer.JavaApiConsumer' }

tasks.register('verifyCallableAmbiguity') {
    dependsOn tasks.named('classes')
    doLast {
        def compiler = javax.tools.ToolProvider.systemJavaCompiler
        def diagnostics = new javax.tools.DiagnosticCollector<javax.tools.JavaFileObject>()
        compiler.getStandardFileManager(diagnostics, null, null).withCloseable { manager ->
            def source = manager.getJavaFileObjects(file('src/ambiguity/java/consumer/UncastCallable.java'))
            def output = layout.buildDirectory.dir('ambiguity').get().asFile
            output.mkdirs()
            def options = ['-classpath', sourceSets.main.compileClasspath.asPath, '-d', output.path]
            def compiled = compiler.getTask(null, manager, diagnostics, options, null, source).call()
            if (compiled || !diagnostics.diagnostics.any { it.code == 'compiler.err.ref.ambiguous' }) {
                throw new GradleException("Expected Callable/Supplier ambiguity, received: ${diagnostics.diagnostics}")
            }
            logger.lifecycle('Reproduced packaged Java Callable/Supplier overload ambiguity.')
        }
    }
}

tasks.register('verifyScopeBoundaries') {
    dependsOn tasks.named('classes')
    doLast {
        def compiler = javax.tools.ToolProvider.systemJavaCompiler
        [ProcessFilesystem: 'compiler.err.cant.resolve.location.args', WorkerAsProcess: 'compiler.err.prob.found.req'].each { name, expectedCode ->
            def diagnostics = new javax.tools.DiagnosticCollector<javax.tools.JavaFileObject>()
            compiler.getStandardFileManager(diagnostics, null, null).withCloseable { manager ->
                def source = manager.getJavaFileObjects(file("src/scope/java/consumer/${name}.java"))
                def output = layout.buildDirectory.dir("scope/${name}").get().asFile
                output.mkdirs()
                def options = ['-classpath', sourceSets.main.compileClasspath.asPath, '-d', output.path]
                def compiled = compiler.getTask(null, manager, diagnostics, options, null, source).call()
                if (compiled || !diagnostics.diagnostics.any { it.code == expectedCode }) {
                    throw new GradleException("Expected scope rejection ${expectedCode}, received: ${diagnostics.diagnostics}")
                }
            }
        }
        logger.lifecycle('Packaged process/worker compile-time scope boundaries passed.')
    }
}
