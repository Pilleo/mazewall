services:
    mazewall:
        image: mazewall-dev:latest
        build:
            context: ../..
            dockerfile: infra/dev/Containerfile
        volumes:
            - ../..:/workspace
            - ${MAZEWALL_CONTAINER_CACHE_DIR:?Set a caller-owned container cache directory}:/container-gradle-home
        userns_mode: keep-id
        user: "${MAZEWALL_UID:?Set MAZEWALL_UID to id -u}:${MAZEWALL_GID:?Set MAZEWALL_GID to id -g}"
        environment:
            - GRADLE_USER_HOME=/container-gradle-home
            - HOME=/tmp
            - GITHUB_ACTOR
            - GITHUB_TOKEN
        # Use a custom seccomp profile via annotation to whitelist filter stacking.
        # This maintains container isolation while allowing nested sandboxes.
        annotations:
            io.podman.annotations.seccomp: ${PWD}/infra/dev/podman-seccomp.json
        working_dir: /workspace
        # Default to keeping the container alive for execution
        command: tail -f /dev/null
