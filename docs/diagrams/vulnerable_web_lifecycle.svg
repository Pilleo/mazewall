875" y1="1015.8244" y2="1035.8244"/><polygon fill="#A80036" points="311.875,1025.8244,315.875,1035.8244,319.875,1025.8244,315.875,1029.8244" style="stroke: #A80036; stroke-width: 1.0;"/><!--MD5=[d58bf65856cfca2f67d80c02fdfcac03]
@startuml
skinparam backgroundColor transparent
skinparam shadowing false
title Vulnerable web demo — startup and evidence lifecycle

start
:Spring prepares Environment;
:Resolve mazewall.enabled once;
if (Protection enabled?) then (yes)
  :Install process-wide NO_EXEC baseline;
  :Publish resolved-enabled=true;
  :Create contained service executors;
else (no)
  :Publish resolved-enabled=false;
  if (Profile mode?) then (yes)
    :Create profiling service executors;
  else (no)
    :Create deliberately unprotected services;
  endif
endif
:Accept service work;
:Spring shutdown begins;
:Stop admission;
:Drain all accepted work to one deadline;
if (Profile mode?) then (yes)
  :Close profiler sessions;
  :Freeze Bill of Behavior;
  :Atomically replace stack trace artifact;
  :Atomically replace SBoB;
  :Atomically replace digest-backed integrity manifest;
endif
stop
@enduml

