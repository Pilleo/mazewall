plugins {
    id 'java-gradle-plugin'
}

gradlePlugin {
    plugins {
        testHealth {
            id = 'io.mazewall.test-health'
            implementationClass = 'io.mazewall.build.TestHealthPlugin'
        }
    }
}

repositories {
    mavenCentral()
}

def verificationActionsMarker = layout.buildDirectory.file('verification/verification-actions.success')

tasks.register('verificationActionsTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.mazewall.build.VerificationActionsTest'
    inputs.files(sourceSets.main.allSource, sourceSets.test.allSource)
        .withPropertyName('verificationSources')
        .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.file(layout.projectDirectory.file('build.gradle'))
        .withPropertyName('verificationBuildLogic')
        .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.file(layout.projectDirectory.file('../build.gradle.kts'))
        .withPropertyName('rootVerificationTaskWiring')
        .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.file(layout.projectDirectory.file('../gradle/libs.versions.toml'))
        .withPropertyName('rootVerificationPluginCatalog')
        .withPathSensitivity(PathSensitivity.RELATIVE)
    outputs.file(verificationActionsMarker)
    args(verificationActionsMarker.get().asFile.absolutePath)
    doFirst {
        verificationActionsMarker.get().asFile.delete()
    }
}

tasks.named('check') {
    dependsOn 'verificationActionsTest'
}

// These are executable contract fixtures, not JUnit classes. The mandatory
// verificationActionsTest runs their assertions, including real TestKit builds.
tasks.named('test') {
    dependsOn 'verificationActionsTest'
    failOnNoDiscoveredTests = false
}

// buildSrc is compiled before the root build; exercise its verification logic before use.
tasks.named('jar') {
    dependsOn 'verificationActionsTest'
}
