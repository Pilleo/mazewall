plugins {
    id 'java-gradle-plugin'
}

gradlePlugin {
    plugins {
        testHealth {
            id = 'io.mazewall.test-health'
            implementationClass = 'io.mazewall.build.TestHealthPlugin'
        }
    }
}

repositories {
    mavenCentral()
}

tasks.register('verificationActionsTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.mazewall.build.VerificationActionsTest'
}

tasks.named('check') {
    dependsOn 'verificationActionsTest'
}

// These are executable contract fixtures, not JUnit classes. The mandatory
// verificationActionsTest runs their assertions, including real TestKit builds.
tasks.named('test') {
    dependsOn 'verificationActionsTest'
    failOnNoDiscoveredTests = false
}

// buildSrc is compiled before the root build; exercise its verification logic before use.
tasks.named('jar') {
    dependsOn 'verificationActionsTest'
}
